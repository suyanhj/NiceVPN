name: Tests

on:
  push:
    branches:
      - admin-ui
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - admin-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-bootstrap-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    name: Generate frontend lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate package-lock.json
        working-directory: app/ui/vue/frontend
        run: |
          npm config set registry "https://registry.npmmirror.com"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: app/ui/vue/frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1

  changes:
    name: Detect expensive test scope
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
      browser: ${{ steps.scope.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 手动执行用于完整验证，不做路径裁剪。
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "docker=true" >> "${GITHUB_OUTPUT}"
            echo "browser=true" >> "${GITHUB_OUTPUT}"
            printf '### Expensive test scope\n- Docker build: true (manual run)\n- Browser smoke: true (manual run)\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          base_sha="${BEFORE_SHA:-}"
          head_sha="${GITHUB_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # pull_request synchronize 事件的 before 是“上一次 PR head”，
            # 用它只判断本次新增提交；否则从 PR base 比较，确保首次 PR 完整验证。
            head_sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              base_sha="${PR_BASE_SHA:-}"
            fi
          fi

          echo "Diff base: ${base_sha}"
          echo "Diff head: ${head_sha}"

          # 新分支首次 push 或事件缺少可比较基线时，宁可完整验证一次。
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "docker=true" >> "${GITHUB_OUTPUT}"
            echo "browser=true" >> "${GITHUB_OUTPUT}"
            printf '### Expensive test scope\n- Docker build: true (no safe diff base)\n- Browser smoke: true (no safe diff base)\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")
          printf '%s\n' "${changed_files[@]}"

          docker=false
          browser=false
          for file in "${changed_files[@]}"; do
            case "${file}" in
              .dockerignore|deploy/docker/*|build-ui.sh|requirements.txt|app/ui/vue/frontend/*)
                docker=true
                ;;
            esac
            case "${file}" in
              .github/workflows/tests.yml|app/ui/*|tests/browser/*|build-ui.sh|deploy/docker/Dockerfile|requirements.txt)
                browser=true
                ;;
            esac
          done

          echo "docker=${docker}" >> "${GITHUB_OUTPUT}"
          echo "browser=${browser}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Expensive test scope"
            echo "- Docker build: ${docker}"
            echo "- Browser smoke: ${browser}"
            echo "- Diff base: \`${base_sha}\`"
            echo "- Diff head: \`${head_sha}\`"
            echo "- Changed files: ${#changed_files[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

  frontend-build:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: false
          tags: nicevpn:ci
          cache-from: type=gha,scope=nicevpn-runtime
          cache-to: type=gha,mode=max,scope=nicevpn-runtime
          provenance: false

  unit:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  browser-smoke:
    name: Browser smoke (Chrome)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/vue/frontend/package.json

      - name: Build V2 frontend assets
        working-directory: app/ui/vue/frontend
        run: |
          npm config set registry "https://registry.npmmirror.com"
          npm install --no-audit --no-fund --package-lock=false
          npm run check
          test -s ../dist/VpnSpotlightSurface.js
          test -s ../dist/VpnInteractiveGrid.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest-selenium>=4.1,<5" "selenium>=4.11,<5"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run browser smoke
        run: >
          python -m pytest -c tests/browser/pytest.ini tests/browser -q
          --driver Chrome


  integration-validate:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Git diff whitespace
        run: git diff --check origin/admin-ui...HEAD

      - name: Validate UTF-8 and replacement characters
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (
              Path("app/ui"),
              Path("tests/unit"),
              Path("tests/browser"),
              Path("openspec/changes/vpn-admin-ui"),
              Path("openspec/changes/vpn-admin-ui-v2"),
          )
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in {".py", ".css", ".js", ".md", ".yaml", ".yml", ".json", ".vue", ".ts"}:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as exc:
                      failures.append(f"{path}: invalid UTF-8: {exc}")
                      continue
                  if "\ufffd" in text:
                      failures.append(f"{path}: contains U+FFFD replacement character")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Validate shell entrypoints
        run: |
          bash -n build-ui.sh
          bash -n start.sh
          grep -F 'build-ui.sh' start.sh

      - name: OpenSpec strict validation
        run: |
          npx --yes @fission-ai/openspec@1.14.2 validate vpn-admin-ui --strict --no-interactive
          npx --yes @fission-ai/openspec@1.14.2 validate vpn-admin-ui-v2 --strict --no-interactive

      - name: Verify clean repository after validation
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
