name: Tests

on:
  push:
    branches:
      - admin-ui
      - main
  pull_request:
    branches:
      - main
      - admin-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  browser-smoke:
    name: Browser smoke (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-selenium>=4.1,<5" "selenium>=4.11,<5"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run browser smoke
        run: >
          python -m pytest -c tests/browser/pytest.ini tests/browser -q
          --driver Chrome


  integration-validate:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Git diff whitespace
        run: git diff --check origin/admin-ui...HEAD

      - name: Validate UTF-8 and replacement characters
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (
              Path("app/ui"),
              Path("tests/unit"),
              Path("tests/browser"),
              Path("openspec/changes/vpn-admin-ui"),
              Path("openspec/changes/vpn-admin-ui-v2"),
          )
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in {".py", ".css", ".js", ".md", ".yaml", ".yml", ".json"}:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as exc:
                      failures.append(f"{path}: invalid UTF-8: {exc}")
                      continue
                  if "\ufffd" in text:
                      failures.append(f"{path}: contains U+FFFD replacement character")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: OpenSpec strict validation
        run: |
          npx --yes @fission-ai/openspec@1.14.2 validate vpn-admin-ui --strict --no-interactive
          npx --yes @fission-ai/openspec@1.14.2 validate vpn-admin-ui-v2 --strict --no-interactive

      - name: Verify clean repository after validation
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
